<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Owner Analytics — Illustrative test data</title>

<body><div class="a5-banner">Illustrative test data · Synthetic acceptance environment. No actual Patient identities or clinic financial records.</div><div id="root"></div><script type="module">
import React, { useState } from 'react'
import { createRoot } from 'react-dom/client'
import { AnalyticsPage } from '/src/pages/Admin.jsx'

import '/src/styles.css'
import '/src/foundation.css'
import '/src/patient.css'
import '/src/polish.css'

const today = new URLSearchParams(location.search).get('today') || '2026-10-31'
setClockSource(() => new Date(`${today}T12:00:00+08:00`))
const branches = [{id:'b1',publicId:'01j00000000000000000000b01',name:'Illustrative Branch 1'}, {id:'b2',publicId:'01j00000000000000000000b02',name:'Illustrative Branch 2'}]
function Fixture() {
  const [branch,setBranch] = useState('Illustrative Branch 1')
  const state = {branches,appointments:[],queue:[],hmo:[],invoices:[],inquiries:[],conversations:[],dentists:[],patients:[]}
  return React.createElement(React.Fragment,null,
    React.createElement('label',null,'Branch',React.createElement('select',{ 'aria-label':'Acceptance branch',value:branch,onChange:e=>setBranch(e.target.value) }, ...['All Branches',...branches.map(b=>b.name),'Unavailable branch'].map(name=>React.createElement('option',{key:name},name)))),

createRoot(document.getElementById('root')).render(React.createElement(Fixture))
